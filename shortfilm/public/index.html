<style>
:root{
  --bg:#FFFFFF;--surface:#F2F2F4;--surface2:#E5E5EA;--ink:#111114;--muted:#7A7A82;--line:rgba(17,17,20,.09);
  --tab:rgba(255,255,255,.78);--accent:#FF5A1F;--gold:#F2B84B;--rose:#FF3B5C;

}

  --bg:#000000;--surface:#1C1C1F;--surface2:#2C2C30;--ink:#F5F5F7;--muted:#9C9CA4;--line:rgba(255,255,255,.1);--tab:rgba(30,30,33,.78);color-scheme:dark}}

/* fond noir permanent : pas de changement de teinte */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .7s ease,color .7s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);transition:background-color .7s ease}
body.feed-on::before{display:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.ic{display:inline-flex}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.solid svg{fill:currentColor;stroke:none}

.app{max-width:440px;margin:0 auto;padding-bottom:120px;min-height:100%}
.view{display:none}.view.on{display:block}
.head{padding:16px 18px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head small{display:block;color:var(--muted);font-size:14px;font-weight:500}
.head h1{margin:4px 0 0;font-size:27px;line-height:1.1;font-weight:600;letter-spacing:-.025em}
.me-btn{position:relative;width:46px;height:46px;border-radius:50%;overflow:hidden;flex:0 0 auto;margin-top:4px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 16px 10px}
.askbar{display:flex;align-items:center;gap:10px;height:52px;border-radius:999px;background:var(--surface);padding:0 8px;width:100%;text-align:left;color:var(--muted)}
.askbar .ai{height:36px;padding:0 12px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto}
.askbar .ai .ic svg{width:15px;height:15px}
.askbar .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.askbar input{flex:1;border:0;background:none;outline:none;height:100%;font-size:16px;color:var(--ink);min-width:0}
.askbar input::placeholder{color:var(--muted)}
.askbar .go{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:0 0 auto}
.askbar .go .ic svg{width:17px;height:17px}
.tabs{display:flex;gap:20px;padding:12px 4px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.rail::-webkit-scrollbar,.hero::-webkit-scrollbar,.stories::-webkit-scrollbar,.stills::-webkit-scrollbar,.flags::-webkit-scrollbar{display:none}
.tabs button{font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink)}

/* stories */
.stories{display:flex;gap:10px;overflow-x:auto;padding:8px 16px 2px;scrollbar-width:none}
.story{flex:0 0 auto;width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.ring{display:block;position:relative;width:74px;height:74px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#FF5A1F,#FFB547,#FF3B8A,#FF5A1F)}
.ring.seen{background:var(--surface2)}
.ring .pic{display:block;position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--bg)}
.ring .badge{position:absolute;top:-3px;right:-3px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2.5px solid var(--bg);z-index:2}
.story .n{max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hero */
.hero-wrap{position:relative;margin:14px 10px 0}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:32px;scrollbar-width:none}
.hero-item{flex:0 0 100%;scroll-snap-align:center;position:relative;height:min(80vh,700px);min-height:540px;overflow:hidden;color:#fff}
.hero-item::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.93))}
.hero-body{position:absolute;left:18px;right:18px;bottom:60px;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center}
.award{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;line-height:1.15;margin-bottom:16px}
.award small{display:block;font-weight:500;opacity:.8;font-size:12.5px}
.award svg{width:18px;height:34px;fill:currentColor}
.hero-title{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;margin:0 0 14px;text-wrap:balance}
.hmeta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;font-size:14px;font-weight:600}
.hmeta i{font-style:normal;opacity:.55}
.hmeta .box{border:1.5px solid currentColor;border-radius:6px;padding:0 5px;font-size:11px;font-weight:700;line-height:17px}
.hero-actions{display:flex;gap:12px;align-items:center;margin-top:20px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap}
.pill .ic svg{width:20px;height:20px}
.pill-white{background:#fff;color:#111114}
.hero-actions .pill{min-width:210px}
.pill-ink{background:var(--ink);color:var(--bg)}
.pill-accent{background:var(--accent);color:#fff}
.pill-glass{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.wide{width:100%}
.circle{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;flex:0 0 auto}
.circle.on{background:#fff;color:#111}
.hdots{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:7px;z-index:3;pointer-events:none}
.hdots span{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.45);transition:width .25s,background .25s}
.hdots span.on{width:28px;background:#fff}

/* sections */
.sec{margin-top:36px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 12px;gap:10px}
.sec-head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.sec-head .lk{display:inline-flex;align-items:center;gap:2px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.sec-head .lk .ic svg{width:21px;height:21px;stroke-width:2.6}
.sec-head p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.rail{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.card{flex:0 0 172px;aspect-ratio:2/3;border-radius:24px;overflow:hidden;position:relative;color:#fff;text-align:left;scroll-snap-align:start;background:var(--surface)}
.card::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,0) 48%,rgba(0,0,0,.78))}
.card.big{flex-basis:252px}
.card.wide{flex-basis:320px;aspect-ratio:16/11}
.ct{position:absolute;left:13px;right:13px;bottom:13px;z-index:2;display:block}
.ct small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.72;margin-bottom:4px}
.ct b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.card.big .ct b,.card.wide .ct b{font-size:22px}
.tag,.dchip{position:absolute;top:10px;z-index:2;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
.tag{left:10px}.dchip{right:10px}
.tag.paid{background:var(--accent)}
.tag.owned{background:#fff;color:#111}
.rail.toprail{gap:24px;padding-top:6px}
.top{flex:0 0 auto;display:flex;align-items:flex-end;scroll-snap-align:start;padding-left:4px}
.top .num{flex:none;font-weight:600;font-size:170px;letter-spacing:-.06em;line-height:.76;color:transparent;-webkit-text-stroke:2px var(--ink);margin-right:-18px;position:relative;z-index:0}
.top .card{flex:none;width:148px;height:222px;aspect-ratio:auto;z-index:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.grid .card{flex:none;width:100%}
.grid .card .ct b{font-size:18px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
.bento .card{flex:none;width:100%}
.bento .card:first-child{grid-column:span 2;aspect-ratio:4/5;border-radius:30px}
.bento .card:first-child .ct{left:20px;right:20px;bottom:20px}
.bento .card:first-child .ct b{font-size:34px;letter-spacing:-.03em;line-height:1.05}

/* Nike-like categories */
.mesh{position:relative;margin:0 10px;border-radius:32px;overflow:hidden;background:#121214;color:#F5F5F7;padding:24px 22px 34px}
.mesh .blob{position:absolute;border-radius:50%;filter:blur(48px);opacity:.5;pointer-events:none}
.mesh .mtop{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;font-weight:600;font-size:14px}
.mesh .mtop b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.mesh .vert{position:absolute;right:12px;top:90px;writing-mode:vertical-rl;font-size:13px;font-weight:600;opacity:.6;z-index:1}
.cats{position:relative;z-index:1;display:flex;flex-direction:column;gap:24px}
.cat{display:block;text-align:left;align-self:flex-start;max-width:86%}
.cat:nth-child(even){align-self:flex-end;text-align:right;margin-right:26px}
.cat small{display:block;font-size:13px;font-weight:500;opacity:.68}
.cat b{display:block;font-size:clamp(30px,9.5vw,42px);font-weight:600;letter-spacing:-.035em;line-height:.98}
.cat em{display:block;font-style:normal;font-size:12px;font-weight:600;opacity:.55;margin-top:4px}

/* spotlight */
.spot{padding:4px 0}
.spot-card{position:relative;margin:0 10px;border-radius:32px;overflow:hidden;aspect-ratio:4/5.3;color:#fff}
.spot-card .hit{position:absolute;inset:0;z-index:1}
.float{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;border-radius:26px;padding:16px;background:rgba(20,20,22,.36);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);color:#fff}
.float .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chipg{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:600}
.chipg .ic svg{width:15px;height:15px}
.float h3{margin:16px 0 6px;font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.08}
.float p{margin:0 0 16px;font-size:14px;opacity:.86}
.float .pill{height:50px;width:100%}
.stills{display:flex;gap:10px;overflow-x:auto;padding:12px 10px 0;scrollbar-width:none;scroll-snap-type:x proximity}
.still{flex:0 0 78%;aspect-ratio:16/10;position:relative;border-radius:22px;overflow:hidden;scroll-snap-align:start}

/* list (EV style) */
.list{margin:0 10px;padding:4px 14px;border-radius:30px;background:var(--surface)}
.lrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .th{position:relative;width:64px;height:64px;border-radius:18px;overflow:hidden}
.lrow .lt{text-align:left;min-width:0}
.lrow b{display:block;font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow small{display:block;color:var(--muted);font-size:13px}
.lpill{height:38px;padding:0 13px;border-radius:999px;background:var(--bg);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.lpill .ic svg{width:13px;height:13px}

.promo{margin:36px 10px 0;border-radius:32px;overflow:hidden;position:relative;min-height:300px;color:#fff;display:flex;align-items:flex-end}
.promo .collage{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.promo .collage>div{position:relative}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.88))}
.promo-body{position:relative;z-index:2;padding:22px}
.promo h3{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.08;margin:0 0 8px}
.promo p{margin:0 0 16px;opacity:.85;max-width:30ch}
.flags{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.flag{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.flag span{font-size:20px}

/* feed */
#feed{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);overflow-y:auto;scroll-snap-type:y mandatory;background:#000;z-index:15;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;color:#fff}
.slide .art{inset:-6%;animation:kb 20s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-2%,-3%)}}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 18%,rgba(0,0,0,0) 46%,rgba(0,0,0,.9))}
.tap{position:absolute;inset:0;z-index:1}
.ftabs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:16;display:flex;gap:20px;font-weight:700;font-size:16px;color:#fff}
.ftabs button{white-space:nowrap;opacity:.55;padding-bottom:4px}
.ftabs button.on{opacity:1;border-bottom:2px solid #fff}
.f-info{position:absolute;left:16px;right:80px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:3}
.byline{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600;text-align:left}
.byline .pic{position:relative;width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid #fff}
.follow{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1.5px solid rgba(255,255,255,.75)}
.follow.on{background:#fff;color:#111;border-color:#fff}
.f-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.f-title{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.04;margin:6px 0 10px;text-wrap:balance}
.f-syn{margin:0 0 14px;font-size:14px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.f-row{display:flex;gap:8px}
.f-row .pill{height:46px;padding:0 18px;font-size:14px}
.cpill{flex:1;min-width:0;height:46px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:8px;padding:0 16px;color:rgba(255,255,255,.88);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden}
.cpill .ic svg{width:18px;height:18px}
.side{position:absolute;right:8px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;gap:18px;align-items:center}
.side button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;width:60px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.side .ic svg{width:31px;height:31px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.side .on .ic svg{fill:#FF3B5C;stroke:#FF3B5C}
.side .saved.on .ic svg{fill:#fff;stroke:#fff}
.side .rated .ic svg{fill:#F2B84B;stroke:#F2B84B}
.burst{position:absolute;z-index:4;pointer-events:none;animation:burst .8s ease-out forwards}
.burst svg{width:100px;height:100px;fill:#FF3B5C}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.fempty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;color:#fff}
.fempty h2{margin:0;font-size:26px;font-weight:600;letter-spacing:-.025em}
.fempty p{margin:0;opacity:.7;max-width:30ch}

/* floating tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 24px),416px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px;border-radius:34px;background:var(--tab);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.14);transition:background-color .7s ease,border-color .7s}
.tabbar button{height:52px;min-width:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-weight:700;font-size:14px;transition:background-color .25s,color .25s}
.tabbar button .l{display:none}
.tabbar button.on{background:var(--ink);color:var(--bg);padding:0 18px}
.tabbar button.on .l{display:inline}
.tabbar .create,.tabbar .create.on{background:var(--accent);color:#fff}
body.feed-on .tabbar{background:rgba(25,25,28,.55);border-color:rgba(255,255,255,.12)}
body.feed-on .tabbar button{color:rgba(255,255,255,.7)}
body.feed-on .tabbar button.on{background:#fff;color:#111}
body.feed-on .tabbar .create{color:#fff}

/* layers */
.layer{position:fixed;top:0;bottom:0;left:50%;width:min(100%,440px);transform:translate(-50%,100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s linear .38s;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);color:var(--ink);z-index:40}
.layer.open{transform:translate(-50%,0);visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#cpage{z-index:45}
.d-hero{position:relative;height:min(68vh,600px);min-height:460px;color:#fff}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5))}
.d-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:3;display:flex;justify-content:space-between}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.who{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:12px;padding:10px;border-radius:26px;background:rgba(20,20,22,.38);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);color:#fff}
.who .pic{position:relative;width:48px;height:48px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:2px solid rgba(255,255,255,.85)}
.who .tx{flex:1;text-align:left;min-width:0}
.who b{display:block;font-size:15px}
.who small{opacity:.75;font-size:12.5px}
.fbtn{height:40px;padding:0 16px;border-radius:999px;background:#fff;color:#111;font-weight:700;font-size:13px}
.fbtn.on{background:rgba(255,255,255,.2);color:#fff}
.d-body{padding:22px 18px 40px}
.d-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.d-title{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.06;margin:6px 0 16px;text-wrap:balance}
.d-cta{display:grid;grid-template-columns:1fr auto auto;gap:10px}
.sq{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.sq.on{background:var(--rose);color:#fff}
.sq.saved.on{background:var(--ink);color:var(--bg)}
.access{margin:10px 0 0;font-size:13px;color:var(--muted)}
.syn{margin:18px 0 0;font-size:16px;line-height:1.6}
.irows{margin-top:20px;border-top:1px solid var(--line)}
.irow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.irow span{color:var(--muted)}
.irow b{font-weight:600;text-align:right}
.block{margin-top:30px}
.block h3{margin:0 0 12px;font-size:18px;font-weight:600;letter-spacing:-.015em}
.eps{display:flex;flex-direction:column;gap:10px}
.ep{display:grid;grid-template-columns:124px 1fr;gap:12px;align-items:center;text-align:left}
.ep .thumb{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden}
.ep b{display:block}
.ep small{color:var(--muted)}
.stars{display:flex;gap:6px}
.stars button{color:var(--surface2)}
.stars button.on{color:var(--gold)}
.stars .ic svg{width:34px;height:34px;fill:currentColor;stroke:none}
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:24px;background:var(--surface)}
.rate-row small{display:block;color:var(--muted);font-size:13px}
.big-score{font-size:36px;font-weight:600;letter-spacing:-.03em;line-height:1}
.cmt{display:flex;gap:10px;padding:10px 0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#111;flex:0 0 auto}
.cmt p{margin:2px 0 0}
.cmt small{color:var(--muted)}
.cmt .lk{margin-left:auto;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center}
.cmt .lk .ic svg{width:18px;height:18px}
.cmt .lk.on{color:var(--rose)}

const card=(it,cls="")=>`<button class="card ${cls}" data-open="${esc(it.id)}" aria-label="${esc(it.t)}${hasDist(it)?", "+esc(it.dt):""}">${imgBox(it)}${tagOf(it)}<span class="dchip">${dur(it)}</span><span class="ct"><small>${esc(it.g)}</small><b>${esc(it.t)}</b></span></button>`;
const secHead=(title,sub,act)=>`<div class="sec-head"><div>${act?`<button class="lk" ${act}>${title}${ic("chev")}</button>`:`<h2>${title}</h2>`}${sub?`<p>${sub}</p>`:""}</div></div>`;
const row=(title,sub,items,cls="",act="",min=1)=>items.length>=min?`<div class="sec">${secHead(title,sub,act)}<div class="rail">${items.map(i=>card(i,cls)).join("")}</div></div>`:"";
const trow=(k,L,cls)=>{const t=TH[k],it=sortP(L.filter(x=>x.th.includes(k))).slice(0,14);return row(t.n,t.d,it,cls||"",`data-act="theme" data-v="${k}"`,2)};
const playCta=(it,cls)=>`<button class="pill ${cls}" data-act="play" data-id="${esc(it.id)}">${ic("play","solid")}Regarder</button>`;
function awardHTML(it){
  if(!hasDist(it))return "";
  const t=`<span>${esc(it.dt)}<small>${esc(it.d)}</small></span>`;
  return `<div class="award">${prio(it)>=4?laurel(0)+t+laurel(1):t}</div>`;
}
function heroItem(it,first){

function spot(it,title,sub){
  if(!it)return "";

function shortList(L){

function homeBody(){
  const L=ALL(),ids=new Set(L.map(x=>x.id));
  let heroes=HEROIDS.map(get).filter(x=>x&&ids.has(x.id));
  if(heroes.length<3)heroes=heroes.concat(sortP(L).filter(x=>!heroes.includes(x)).slice(0,5-heroes.length));
  const oscW=L.filter(x=>x.dt==="Lauréat"&&isOscar(x)),oscN=L.filter(x=>x.dt==="Nomination"&&isOscar(x));
  const top=TOPIDS.map(get).filter(x=>x&&ids.has(x.id));
  const spots=SPOTIDS.map(get).filter(x=>x&&ids.has(x.id));
  const others=sortP(L.filter(x=>hasDist(x)&&!isOscar(x)||x.dt==="Présélection"));
  const disc=L.filter(x=>!hasDist(x));
  const order=HOMEORDER.filter(k=>L.filter(x=>x.th.includes(k)).length>=2);
  let h="";
  h+=`<div class="hero-wrap"><div class="hero" id="hero">${heroes.map((it,i)=>heroItem(it,i===0)).join("")}</div><div class="hdots" id="dots">${heroes.map((_,i)=>`<span class="${i?"":"on"}"></span>`).join("")}</div></div>`;
  if(EXTRA.length)h+=row("Nouveautés de la communauté","Proposés par des créateurs",EXTRA.filter(x=>ids.has(x.id)),"big");
  h+=row("Lauréats aux Oscars","Les courts qui ont remporté la statuette",oscW,"big");
  h+=top.length>=3?`<div class="sec" style="padding:6px 0 10px">${secHead("Top 10 de la rédaction","Notre sélection pour bien commencer")}<div class="rail toprail">${top.map((it,i)=>`<div class="top"><span class="num" aria-hidden="true">${i+1}</span>${card(it)}</div>`).join("")}</div></div>`:"";
  h+=row("Nommés aux Oscars","Aux portes de la statuette",oscN,"big");
  order.slice(0,3).forEach(k=>h+=trow(k,L));
  h+=spot(spots[0],"Coup de cœur","Choisi par la rédaction");
  order.slice(3,6).forEach(k=>h+=trow(k,L));
  h+=shortList(L);
  order.slice(6,9).forEach(k=>h+=trow(k,L));
  h+=spot(spots[1],"À ne pas manquer","Un court primé à découvrir");
  order.slice(9).forEach(k=>h+=trow(k,L));
  h+=row("Autres prix et sélections","Festivals, César, Annecy et plus",others,"wide");
  h+=row("Découvertes","Des pépites sans distinction documentée",disc,"wide");
  h+=`<p class="credit">${CREDIT}</p>`;
  return h;
}

const FADE_MS=7000,WAKE_MS=5000;

let FEEDOBS=null,ACTIVE=null,calmT=null,SOUND=false,lastTap=0;
const FROW1=[["all","Tout"],["won","Primés"],["fr","Français"],["en","Anglais"],["short","Moins de 10 min"],["silent","Sans dialogue"]];
const frameCls=()=>FRAME==="fit"?"m-fit":"m-fill";
function filterList(){
  let L=ALL();
  if(fA==="won")L=L.filter(x=>x.dt==="Lauréat"||x.dt==="Nomination");
  else if(fA==="fr")L=L.filter(x=>x.lk==="fr");
  else if(fA==="en")L=L.filter(x=>x.lk==="en");
  else if(fA==="short")L=L.filter(x=>x.m<=10);
  else if(fA==="silent")L=L.filter(x=>x.lk==="none");
  if(fB)L=L.filter(x=>x.th.includes(fB));
  return [...L].sort((a,b)=>((prio(b)>=4)-(prio(a)>=4))||(hash(a.id+"f")%97-hash(b.id+"f")%97));
}
function resizeFeed(){const f=document.getElementById("feed");if(!f.clientWidth)return;f.style.setProperty("--w",f.clientWidth+"px");f.style.setProperty("--h",f.clientHeight+"px")}
window.addEventListener("resize",resizeFeed);

function renderFeed(){
  deactivate();

  const chip=(v,n,on)=>`<button class="fchip ${on?"on":""}" data-act="ffilter" data-v="${esc(v)}" role="tab" aria-selected="${on}">${esc(n)}</button>`;
  document.getElementById("ffilters").innerHTML=`<div class="fc-row" role="tablist" aria-label="Sélection">${FROW1.map(([k,n])=>chip("a:"+k,n,k===fA)).join("")}</div><div class="fc-row" role="tablist" aria-label="Thèmes">${[["","Tous les thèmes"]].concat(THEMES.map(t=>[t.k,t.n])).map(([k,n])=>chip("b:"+k,n,(fB||"")===k)).join("")}</div>`;
  document.querySelectorAll("#ffilters .fchip.on").forEach(on=>{if(on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"})});
  const feed=document.getElementById("feed");
  feed.innerHTML=L.length?L.map((it,i)=>slideHTML(it,i<1)).join(""):`<div class="slide m-fit"><div class="fempty"><h2>Aucun film</h2><p>Aucun court ne correspond à ces filtres.</p><button class="pill pill-white" data-act="ffilter" data-v="a:all">Tout afficher</button></div></div>`;
  feedBuilt=true;feed.scrollTop=0;resizeFeed();observeFeed();

function observeFeed(){
  if(FEEDOBS)FEEDOBS.disconnect();
  const root=document.getElementById("feed");
  FEEDOBS=new IntersectionObserver(es=>{if(cur!=="feed")return;es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6)activate(e.target)})},{root,threshold:[.6]});
  root.querySelectorAll(".slide[data-id]").forEach(x=>FEEDOBS.observe(x));
}
function nearestSlide(){const r=document.getElementById("feed"),all=r.querySelectorAll(".slide[data-id]");return all[Math.max(0,Math.min(all.length-1,Math.round(r.scrollTop/Math.max(1,r.clientHeight))))]}
function kickFeed(){resizeFeed();if(!feedBuilt)renderFeed();else observeFeed();setTimeout(()=>{if(cur!=="feed")return;resizeFeed();const x=nearestSlide();if(x)activate(x)},80)}
function activate(slide,manual){
  if(ACTIVE&&ACTIVE.slide===slide)return;
  deactivate();
  const it=get(slide.dataset.id);if(!it)return;
  ACTIVE={slide,it,player:null,playing:false,started:false,vh:slide.querySelector(".vbox").innerHTML};
  wake(true);
  if(PREVIEW){ACTIVE.sim=setTimeout(onFeedPlaying,1500);return}
  loadYT().then(()=>{
    if(!ACTIVE||ACTIVE.slide!==slide)return;
    const vf=slide.querySelector(".vbox");vf.innerHTML='<div id="ytfeed"></div>';
    const cc=it.fs==="fourni"&&it.lk!=="fr"?{cc_load_policy:1,cc_lang_pref:"fr"}:{};
    ACTIVE.player=new YT.Player("ytfeed",{width:"100%",height:"100%",videoId:it.yt,host:"https://www.youtube-nocookie.com",playerVars:Object.assign({autoplay:1,mute:1,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3,hl:"fr"},cc),events:{
      onReady:ev=>{if(!ACTIVE||ACTIVE.slide!==slide)return;try{ev.target.playVideo();if(SOUND)ev.target.unMute()}catch(e){}syncSound()},
      onStateChange:ev=>{if(!ACTIVE||ACTIVE.slide!==slide)return;if(ev.data===1)onFeedPlaying();else if(ev.data===2)onFeedPaused();else if(ev.data===0)onFeedEnded()},
      onError:()=>{if(!ACTIVE||ACTIVE.slide!==slide)return;wake(true);slide.classList.remove("m-fill");slide.classList.add("m-fit");const n=nextSlide(slide);vf.innerHTML=`<div class="vfail"><b>Lecture impossible ici</b><span>Le diffuseur a restreint la lecture.</span><a class="pill pill-white" href="${esc(ytUrl(it))}" target="_blank" rel="noopener noreferrer">${ic("ext")}Regarder sur YouTube</a>${n?`<button class="pill pill-glass" data-act="vnext">Film suivant</button>`:""}</div>`}
    }});
  }).catch(()=>{if(manual&&ACTIVE&&ACTIVE.slide===slide){deactivate();play(it.id)}});
}
function nextSlide(sl){const n=sl.nextElementSibling;return n&&n.dataset&&n.dataset.id?n:null}
function deactivate(){
  if(!ACTIVE)return;
  clearTimeout(ACTIVE.sim);clearTimeout(ACTIVE.adv);clearTimeout(calmT);
  try{if(ACTIVE.player&&ACTIVE.player.destroy)ACTIVE.player.destroy()}catch(e){}
  const vf=ACTIVE.slide.querySelector(".vbox");if(vf)vf.innerHTML=ACTIVE.vh;
  ACTIVE.slide.className="slide "+frameCls();
  ACTIVE=null;document.body.classList.remove("calm");
}
function scheduleCalm(ms){clearTimeout(calmT);calmT=setTimeout(()=>{if(ACTIVE&&ACTIVE.playing&&cur==="feed"){document.body.classList.add("calm");if(FRAME==="auto"){ACTIVE.slide.classList.remove("m-fill");ACTIVE.slide.classList.add("m-fit")}}},ms)}
function wake(hold){document.body.classList.remove("calm");clearTimeout(calmT);if(!hold&&ACTIVE&&ACTIVE.playing)scheduleCalm(WAKE_MS)}
function onFeedPlaying(){if(!ACTIVE)return;ACTIVE.playing=true;syncSound();if(!ACTIVE.started){ACTIVE.started=true;scheduleCalm(FADE_MS)}else if(!document.body.classList.contains("calm"))scheduleCalm(WAKE_MS)}
function onFeedPaused(){if(!ACTIVE)return;ACTIVE.playing=false;wake(true)}
function onFeedEnded(){if(!ACTIVE)return;ACTIVE.playing=false;wake(true);const sl=ACTIVE.slide;ACTIVE.adv=setTimeout(()=>{if(ACTIVE&&ACTIVE.slide===sl){const n=nextSlide(sl);if(n)n.scrollIntoView({behavior:"smooth"})}},1800)}
function syncSound(){let m=true;try{m=ACTIVE&&ACTIVE.player?ACTIVE.player.isMuted():true}catch(e){}document.querySelectorAll(".snd").forEach(b=>{b.innerHTML=ic(m?"mute":"vol")+"<span>"+(m?"Muet":"Son")+"</span>";b.classList.toggle("on",!m)})}
function toggleSound(){
  const p=ACTIVE&&ACTIVE.player;if(!p){toast("Le son se règle quand un film est lancé");return}
  try{if(p.isMuted()){p.unMute();p.setVolume(100);SOUND=true}else{p.mute();SOUND=false}}catch(e){}

}

/* ============ Lecteur YouTube ============ */
let YTP=null,ytLoad=null;const PLAYED=new Set();
function loadYT(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(!ytLoad)ytLoad=new Promise((res,rej)=>{
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{if(prev)prev();res()};
    const sc=document.createElement("script");sc.src="https://www.youtube.com/iframe_api";sc.onerror=()=>{ytLoad=null;rej()};document.head.appendChild(sc);
    setTimeout(()=>{ytLoad=null;rej()},10000);
  });
  return ytLoad;
}
function nextFor(it){
  const pool=sortP(ALL().filter(x=>x.id!==it.id&&x.yt)),same=pool.filter(x=>x.th.some(k=>it.th.includes(k)));
  return same.find(x=>!PLAYED.has(x.id))||pool.find(x=>!PLAYED.has(x.id))||same[0]||pool[0];
}
function frameMsg(html){const f=PL.querySelector(".pframe");if(!f)return;let o=f.querySelector(".endc");if(!o){o=document.createElement("div");o.className="endc";f.appendChild(o)}o.innerHTML=html}
function onEnded(id){
  const it=get(id),nx=it&&nextFor(it);
  frameMsg(`<small>Terminé</small>${nx?`<small>Ensuite</small><b>${esc(nx.t)}</b><button class="pill pill-white" data-act="play" data-id="${esc(nx.id)}">${ic("play","solid")}Lire la suite</button>`:""}<button class="pill pill-glass" data-act="replay">Revoir</button>`);
}
function onYtError(id,code){
  const it=get(id);if(!it)return;const nx=nextFor(it);
  frameMsg(`<b>Lecture impossible ici</b><small>${[101,150,153].includes(code)?"Le diffuseur a restreint la lecture dans les applications.":"La vidéo n’est pas disponible pour le moment."}</small><a class="pill pill-white" href="${esc(ytUrl(it))}" target="_blank" rel="noopener noreferrer">${ic("ext")}Regarder sur YouTube</a>${nx?`<button class="pill pill-glass" data-act="play" data-id="${esc(nx.id)}">Court suivant</button>`:""}`);
}
function destroyYT(){try{if(YTP&&YTP.destroy)YTP.destroy()}catch(e){}YTP=null}
function play(id){
  const it=get(id);if(!it||!it.yt)return;
  closeSheet();destroyYT();PLAYED.add(id);
  const cc=it.fs==="fourni"&&it.lk!=="fr"?"&cc_load_policy=1&cc_lang_pref=fr":"";
  const org=location.protocol.startsWith("http")?`&origin=${encodeURIComponent(location.origin)}`:"";
  const src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(it.yt)}?autoplay=1&rel=0&playsinline=1&hl=fr&enablejsapi=1${org}${cc}`;
  const e=esc(id);
  PL.innerHTML=`<div class="p-top"><button class="round" data-act="close-player" aria-label="Fermer le lecteur">${ic("down")}</button><div><b>${esc(it.t)}</b><small>${esc(it.by)}</small></div><button class="round" data-act="share" data-id="${e}" aria-label="Partager">${ic("share")}</button></div>
  <div class="pframe"><iframe id="ytframe" src="${esc(src)}" title="Lecteur YouTube : ${esc(it.t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
  <div class="pinfo"><h2>${esc(it.t)}</h2><p>${esc(it.by)} · ${esc(it.g)} · ${dur(it)}</p>
  <div class="pacts"><button class="sq lk-${e} ${S.liked.includes(id)?"on":""}" data-act="like" data-id="${e}" aria-label="Voter">${ic("heart")}</button><button class="sq" data-act="rate-open" data-id="${e}" aria-label="Noter">${ic("star")}</button><button class="sq" data-act="cmt" data-id="${e}" aria-label="Commentaires">${ic("cmt")}</button><button class="sq saved sv-${e} ${S.list.includes(id)?"on":""}" data-act="list" data-id="${e}" aria-label="Ma liste">${ic("save")}</button></div>
  <p class="pnote">${esc(it.s)}</p><p class="pnote">Diffusé par ${esc(it.ch)} · <a href="${esc(ytUrl(it))}" target="_blank" rel="noopener noreferrer">Un souci de lecture ? Ouvrir sur YouTube</a></p></div>`;
  PL.dataset.id=id;PL.classList.add("open");document.body.classList.add("lock");
  loadYT().then(()=>{if(PL.dataset.id!==id||!PL.classList.contains("open"))return;try{YTP=new YT.Player("ytframe",{events:{onStateChange:ev=>{if(ev.data===0)onEnded(id)},onError:ev=>onYtError(id,ev.data)}})}catch(err){}}).catch(()=>{});

let ex={q:"",lang:"all",theme:null,genre:null};
const SYN={"drôle":"Comédie","drole":"Comédie","rire":"Comédie","comédie":"Comédie","peur":"Thriller","frisson":"Thriller","thriller":"Thriller","amour":"Romance","romance":"Romance","romantique":"Romance","espace":"Science-fiction","futur":"Science-fiction","sf":"Science-fiction","dessin":"Animation","animé":"Animation","animation":"Animation","triste":"Drame","émouvant":"Drame","drame":"Drame","documentaire":"Documentaire","doc":"Documentaire","fantastique":"Fantastique","étrange":"Fantastique"};
const STOP=new Set("un une de des du le la les et à a en qui fait court courts métrage métrages minutes minute min moins pour avec sur je veux film films dans d'une".split(" "));
function parseQ(q){
  let g=null,max=null,lang=null;const m=q.toLowerCase().match(/(\d+)\s*(minutes?|min)?/);if(m)max=+m[1];
  const t=q.toLowerCase().replace(/(\d+)\s*(minutes?|min)?/,"").replace(/sans dialogues?/g,"muet");
  const rest=[];t.split(/[\s,]+/).filter(Boolean).forEach(w=>{
    if(/^fran[cç]ais/.test(w))lang="fr";else if(/^anglais/.test(w))lang="en";else if(w==="muet")lang="none";
    else{const k=Object.keys(SYN).find(s=>w.startsWith(s));if(k)g=SYN[k];else if(!STOP.has(w))rest.push(w)}});
  return {g,max,rest,lang};
}

  <div class="chips">${THEMES.map(t=>chip("theme",t.k,t.n,ex.theme===t.k)).join("")}</div>
  <div class="chips">${GENRES.map(x=>chip("genre",ex.genre===x?"":x,x,ex.genre===x)).join("")}</div></div>`;
  if(filtering){
    const bits=[pq.g&&pq.g.toLowerCase(),pq.max&&`${pq.max} min maximum`,pq.lang&&({fr:"en français",en:"en anglais",none:"sans dialogue"}[pq.lang])].filter(Boolean);
    h+=`<div class="sec" style="margin-top:14px">${secHead(`${L.length} résultat${L.length>1?"s":""}`,bits.length?"Compris : "+bits.join(", "):(ex.theme?esc(TH[ex.theme].d):""))}${L.length?`<div class="grid">${sortP(L).map(i=>card(i)).join("")}</div>`:`<p class="empty">Aucun court ne correspond. Essayez un autre mot ou retirez un filtre.</p>`}</div>`;

    if(!F.t.trim())return err("Ajoutez un titre."),g("ft").focus();
    if(!y)return err("Collez un lien YouTube valide (watch?v=, youtu.be ou shorts)."),g("fu").focus();
    if(ALL().some(x=>x.yt===y)||ROWS.some(r=>r.youtube_id===y))return err("Ce court est déjà au catalogue ou en cours de validation.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(F.email.trim()))return err("Indiquez une adresse e-mail valide pour que nous puissions vous répondre."),g("fe").focus();
    if(!F.ok)return err("Confirmez que vous détenez les droits de ce court.");
    err("");
    const type=F.g==="Documentaire"?"Documentaire":"Film",syn=F.syn.trim()||"Court proposé par son équipe, en cours de validation.";
    if(ONLINE){
      if(needLogin("proposer vos courts"))return;
      const btn=g("studioForm").querySelector("[type=submit]");btn.disabled=true;btn.textContent="Envoi…";
      const {error}=await sb.from("contents").insert({id:"u-"+y,title:F.t.trim(),type,genre:F.g,country:F.co,minutes:F.min,creator_name:ME,creator_id:USER.id,synopsis:syn,youtube_id:y,language:F.lg,channel_name:ME});
      if(error){btn.disabled=false;btn.textContent="Envoyer pour validation";return err("Envoi impossible : "+error.message)}
      F={...F,t:"",url:"",syn:"",ok:false};await loadRemote();renderStudio();window.scrollTo(0,0);toast("Court envoyé, en validation");return;
    }
    const btn=g("studioForm").querySelector("[type=submit]");btn.disabled=true;btn.textContent="Envoi…";
    try{
      if(!PREVIEW){const r=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({"form-name":"proposition","bot-field":"",email:F.email.trim(),titre:F.t.trim(),lien:"https://www.youtube.com/watch?v="+y,genre:F.g,langue:F.lg,pays:F.co,duree:String(F.min),synopsis:syn,droits:"oui"}).toString()});if(!r.ok)throw new Error("http")}
      S.mine.unshift({id:"u-"+y,t:F.t.trim(),by:ME,g:F.g,ty:type,co:F.co,lg:F.lg,lk:lkOf(F.lg),y:null,m:F.min,sc:F.min*60,s:syn,dt:"Non documenté",d:"",sd:null,yt:y,...ytImgs(y),ch:ME,cu:"",fs:"",th:[],votes:0,rating:0,ncom:0,status:"review"});
      save();F={...F,t:"",url:"",syn:"",ok:false};renderStudio();window.scrollTo(0,0);toast("Proposition envoyée, merci !");
    }catch(e){btn.disabled=false;btn.textContent="Envoyer pour validation";err("Envoi impossible pour le moment. Réessayez dans un instant.")}
  });
}

/* ============ Profil ============ */
function renderProfile(){
  const lst=S.list.map(get).filter(Boolean),liked=S.liked.map(get).filter(Boolean);
  let h=`<div class="c-cover" style="height:200px;background:linear-gradient(135deg,#3b2a55,#111 70%)"></div>
  <div class="c-head"><div class="c-stat"><b>${S.liked.length}</b><small>votes</small></div><div class="c-av">${avBig(ME)}</div><div class="c-stat"><b>${S.follows.length}</b><small>abonnements</small></div></div>
  <div class="c-name">${esc(ME)}</div><p class="c-bio">${Object.keys(S.rates).length} note${Object.keys(S.rates).length>1?"s":""} donnée${Object.keys(S.rates).length>1?"s":""}${ONLINE&&USER?" · "+esc(USER.email||""):""}</p>
  <div class="c-btns"><button class="obtn fill" data-tab="studio">Studio créateur</button><button class="obtn" data-act="share-c" data-v="Shortfilm">Partager Shortfilm</button></div>`;
  if(ONLINE)h+=USER?`<div class="c-btns" style="grid-template-columns:1fr"><button class="obtn" data-act="logout">Se déconnecter</button></div>`:`<div class="subcard" style="background:var(--surface);color:var(--ink)"><h3>Connectez-vous</h3><p>Pour voter, noter, commenter et proposer vos courts.</p><button class="pill pill-ink" data-act="login">Se connecter par e-mail</button></div>`;
  h+=lst.length?row("Ma liste","",lst):`<div class="sec">${secHead("Ma liste","")}<p class="empty" style="padding:0 18px;text-align:left">Touchez le signet ou le + sur un court pour le garder ici.</p></div>`;
  h+=row("Vos votes","",liked);
  h+=`<p class="credit">Shortfilm réunit des courts métrages de tous les genres.</p><div class="settings"><button class="obtn" data-act="reset">Réinitialiser mes données locales</button></div>`;
  document.getElementById("v-profile").innerHTML=h;
}

/* ============ Navigation ============ */
const TABS=[["feed","Regarder","flux"],["explore","Explorer","compass"],["studio","Studio","plus"],["profile","Profil","user"]];
document.getElementById("tabbar").innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}" class="${k==="feed"?"on":""} ${k==="studio"?"create":""}" aria-label="${l}">${ic(i)}<span class="l">${l}</span></button>`).join("");
let cur="home";
function go(tab){
  cur=tab;
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+tab));
  const feed=document.getElementById("feed");
  if(tab!=="feed")deactivate();
  feed.hidden=tab!=="feed";document.getElementById("ffilters").hidden=tab!=="feed";document.body.classList.toggle("feed-on",tab==="feed");
  if(tab==="feed")kickFeed();
  if(tab==="explore")renderExplore();
  if(tab==="studio")renderStudio();
  if(tab==="profile")renderProfile();
  closeDetail();CP.classList.remove("open");unlock();window.scrollTo(0,0);
}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}

/* ============ Délégation ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-open],[data-tab]");if(!t)return;
  if(t.dataset.open){if(SW.classList.contains("open"))closeSheet();if(PL.classList.contains("open"))closePlayer();CP.classList.remove("open");openDetail(t.dataset.open);return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  const id=t.dataset.id,v=t.dataset.v;
  switch(t.dataset.act){
    case"play":play(id);break;
    case"replay":try{YTP.seekTo(0);YTP.playVideo();const o=PL.querySelector(".endc");if(o)o.remove()}catch(err){}break;
    case"like":like(id);break;
    case"list":toggleList(id);break;
    case"rate":rate(id,+t.dataset.n);break;
    case"rate-open":openRate(id);break;
    case"cmt":openComments(id);break;
    case"clike":{if(needLogin("aimer un commentaire"))break;const k=t.dataset.k,on=!S.clikes.includes(k);if(ONLINE&&/^\d+$/.test(k))sbw(on?sb.from("comment_likes").insert({user_id:USER.id,comment_id:+k}):sb.from("comment_likes").delete().match({user_id:USER.id,comment_id:+k}));S.clikes=on?S.clikes.concat(k):S.clikes.filter(x=>x!==k);save();t.classList.toggle("on",on);const n=t.querySelector("span:last-child");n.textContent=String(+n.textContent+(on?1:-1));break}
    case"share":{const it=get(id);share(`${it.t}, un court à voir sur Shortfilm`,it.t);break}
    case"share-c":share(v==="Shortfilm"?"Shortfilm, des courts métrages à voir":`Découvrez les courts de ${v} sur Shortfilm`,v);break;
    case"follow":follow(v);break;
    case"creator":if(PL.classList.contains("open"))closePlayer();openCreator(v);break;
    case"close-creator":CP.classList.remove("open");unlock();break;
    case"close-detail":closeDetail();break;
    case"close-sheet":closeSheet();break;
    case"close-player":closePlayer();break;
    case"login":openLogin();break;
    case"logout":if(sb)sb.auth.signOut();toast("Vous êtes déconnecté");break;
    case"ask":ex={q:"",lang:"all",theme:null,genre:null};go("explore");setTimeout(()=>{const q=document.getElementById("q");if(q)q.focus()},50);break;
    case"theme":closeDetail();ex.theme=(cur==="explore"&&ex.theme===v)?null:v;if(cur!=="explore")go("explore");else renderExplore();break;
    case"genre":ex.genre=v||null;if(cur!=="explore")go("explore");else renderExplore();break;
    case"exlang":ex.lang=v;renderExplore();break;
    case"feedmode":feedMode=v;renderFeed();break;
    case"ffilter":{const k=v.slice(2);if(v[0]==="a")fA=k||"all";else fB=k||null;renderFeed();break}
    case"vplay":{const sl=t.closest(".slide");if(sl)activate(sl,true);else play(id);break}
    case"vnext":{const sl=t.closest(".slide");const n=sl&&nextSlide(sl);if(n)n.scrollIntoView({behavior:"smooth"});break}
    case"snd":toggleSound();break;
    case"frame":cycleFrame();break;
    case"to-form":document.getElementById("pubform").scrollIntoView({behavior:"smooth"});break;
    case"reset":try{localStorage.removeItem(KEY)}catch(e){}location.reload();break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(SW.classList.contains("open"))closeSheet();else if(PL.classList.contains("open"))closePlayer();else if(CP.classList.contains("open")){CP.classList.remove("open");unlock()}else if(D.classList.contains("open"))closeDetail()}});

document.documentElement.setAttribute("data-theme","dark");
renderHome();go("feed");
function refreshAll(){feedBuilt=false;const c=cur;renderHome();if(c!=="home")go(c)}
async function boot(){
  if(!sb||!(await loadRemote()))return;
  const {data:{session}}=await sb.auth.getSession();
  await setUser(session?session.user:null);refreshAll();
  sb.auth.onAuthStateChange((ev,ses)=>{const nid=ses&&ses.user?ses.user.id:null;if(nid===(USER?USER.id:null))return;setTimeout(async()=>{await loadRemote();await setUser(ses?ses.user:null);refreshAll();if(nid){closeSheet();toast("Bienvenue, "+ME)}},0)});
}
boot();

</script>
